name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Locate a Dockerfile anywhere (root or subfolder). Exposes:
      #   steps.dockerfile.outputs.found == 'true' | 'false'
      #   steps.dockerfile.outputs.path  -> path to Dockerfile
      - name: Locate Dockerfile
        id: dockerfile
        shell: bash
        run: |
          set -e
          DF="$(git ls-files | grep -Ei '(^|/)Dockerfile$' | head -n1 || true)"
          if [[ -n "$DF" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$DF"  >> "$GITHUB_OUTPUT"
            echo "Found Dockerfile at: $DF"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile found"
          fi

      # (Optional) quick visibility while you’re tuning paths
      - name: Debug workspace
        run: |
          pwd && ls -la
          find . -maxdepth 3 -name 'Dockerfile' -print || true

      # Build the Docker image if a Dockerfile exists
      - name: Build container
        if: steps.dockerfile.outputs.found == 'true'
        run: |
          docker build -t frontier-image -f "${{ steps.dockerfile.outputs.path }}" .

      # Lightweight smoke test inside the container. We don't fail the job on errors.
      - name: Run smoke test inside container
        if: steps.dockerfile.outputs.found == 'true'
        run: |
          docker run --rm frontier-image bash -lc '
            set -e
            if command -v ros2 >/dev/null 2>&1; then
              ros2 --version || true
              ros2 pkg list | head -n 5 || true
            elif command -v python3 >/dev/null 2>&1; then
              python3 --version || true
            fi
          ' || true
