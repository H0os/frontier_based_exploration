name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Locate a Dockerfile anywhere (root or subfolder). Exposes:
      #   steps.dockerfile.outputs.found == 'true' | 'false'
      #   steps.dockerfile.outputs.path  -> path to Dockerfile
      - name: Locate Dockerfile
        id: dockerfile
        shell: bash
        run: |
          set -e
          DF="$(git ls-files | grep -Ei '(^|/)Dockerfile$' | head -n1 || true)"
          if [[ -n "$DF" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$DF"  >> "$GITHUB_OUTPUT"
            echo "Found Dockerfile at: $DF"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile found"
          fi

      # (Optional) quick visibility while you’re tuning paths
      - name: Debug workspace
        run: |
          pwd && ls -la
          find . -maxdepth 3 -name 'Dockerfile' -print || true

      # Build the Docker image if a Dockerfile exists
      - name: Build container
        if: steps.dockerfile.outputs.found == 'true'
        run: |
          docker build -t frontier-image -f "${{ steps.dockerfile.outputs.path }}" .

      # Lightweight smoke test inside the container. We don't fail the job on errors.
      - name: Run smoke test inside container
        if: steps.dockerfile.outputs.found == 'true'
        run: |
          docker run --rm frontier-image bash -lc '
            set -e
            if command -v ros2 >/dev/null 2>&1; then
              echo "ROS 2 detected:"
              # ros2 has no --version; print the first help line instead
              ros2 --help 2>/dev/null | sed -n "1,2p" || true

              echo "Sample of installed packages:"
              # Avoid BrokenPipe by not using head; sed prints first N lines safely
              ros2 pkg list 2>/dev/null | sed -n "1,10p" || true

              echo "Check for expected sim pkgs (optional):"
              ros2 pkg list 2>/dev/null | grep -E "turtlebot4|create_node|turtlebot4_gz_bringup" || true
            else
              echo "ROS 2 not found; Python version:" && python3 --version || true
            fi
          ' || true
