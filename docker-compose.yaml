# Docker Compose file for TurtleBot Behavior Examples
#
# Usage:
#
# To build the images:
#   docker compose build
#
# To start up a specific service by name:
#   docker compose up <service_name>
#
# To open an interactive shell to a running container:
#   docker exec -it <container_name> bash

services:
  # Base image containing dependencies.
  base:
    image: turtlebot_behavior:base
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:?}
      target: base
    # Interactive shell
    stdin_open: true
    tty: true
    # Networking and IPC for ROS 2
    network_mode: host
    ipc: host
    # Needed to display graphical applications
    privileged: True
    environment:
      # Needed to define a TurtleBot model type (3 or 4)
      - TURTLEBOT_MODEL=${TURTLEBOT_MODEL:-4}
      # Allows graphical programs in the container.
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # Allows graphical programs in the container.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority

  # Overlay image containing the example source code.
  overlay:
    extends: base
    image: turtlebot_behavior:overlay
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: overlay

  # Demo simulation world
  demo-world:
    extends: overlay
    command: ros2 launch tb_worlds tb_demo_world.launch.py
  # Behavior demo using Python and py_trees
  
  demo-frontier-detector-grid:
    extends: overlay
    command: ros2 run frontier_exploration map_utils --find_frontiers

  demo-frontier-detector-ml:
    extends: overlay
    command: ros2 run frontier_exploration map_utils --learned_find_frontiers

  demo-explore:
    extends: overlay
    command: ros2 run frontier_exploration exploration 

  demo-frontier-detector-performance:
    extends: overlay
    command: eog graph_performance_metrics.png
  
  demo-frontier-detector-visualizer:
    extends: overlay
    command: eog result.jpg
  
  
